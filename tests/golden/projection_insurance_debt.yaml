cases:
  - id: PRJ-001
    kind: derived
    description: 1,000,000 deflated at the 3.7% wage rate for 30 years → 336,230.66 (research tolerance 10; exact here)
    calculator: projection.present_value
    input: { calculation_date: '2026-10-11', future_amount: 1000000, basis: superannuation, years_until_payment: 30 }
    expect: { status: ok, result: { present_value: '336230.66' } }
    source: https://www.legislation.gov.au/F2022L00895/latest/text
    checked: verification/projection.md (ACCEPT; exact 336,230.656)
  - id: PRJ-PV-TWO-STAGE
    kind: derived
    description: Two-stage deflator — 100,000 paid 10 years out, retirement in 5 → 100,000 / (1.037^5 × 1.025^5) = 100,000 / 1.3567914836 = 73,703.29
    calculator: projection.present_value
    input: { calculation_date: '2026-10-11', future_amount: 100000, basis: superannuation, years_until_payment: 10, years_until_retirement: 5 }
    expect: { status: ok, result: { present_value: '73703.29' } }
    source: https://www.legislation.gov.au/F2022L00895/latest/text
    checked: orchestrator (independent Python Decimal recomputation)
  - id: PRJ-PV-GENERIC
    kind: derived
    description: Generic calculator — 10,000 in 2 years at 2.5% → 9,518.14
    calculator: projection.present_value
    input: { calculation_date: '2026-10-11', future_amount: 10000, basis: generic, years_until_payment: 2 }
    expect: { status: ok, result: { present_value: '9518.14' } }
    source: https://www.legislation.gov.au/F2026L00271/latest/text
    checked: orchestrator
  - id: PRJ-REPEAL-BLOCK
    kind: blocking
    description: Super deflators after the repeal of 2022/603 (1 July 2027) without user rates → blocked
    calculator: projection.present_value
    input: { calculation_date: '2027-07-01', future_amount: 1000, basis: superannuation, years_until_payment: 5 }
    expect: { status: blocked, blocked_code: PARAMETER_MISSING }
    source: https://www.legislation.gov.au/F2022L00895/latest/text
    checked: verification/projection.md (s8 repeal)
  - id: PRJ-REPEAL-USER-RATES
    kind: derived
    description: After repeal, user-supplied rates are accepted — 1,000 in 1 year at 3% → 970.87
    calculator: projection.present_value
    input: { calculation_date: '2027-07-01', future_amount: 1000, basis: superannuation, years_until_payment: 1, wage_inflation: 0.03, cpi_inflation: 0.025 }
    expect: { status: ok, result: { present_value: '970.87' } }
    source: https://www.legislation.gov.au/F2022L00895/latest/text
    checked: orchestrator
  - id: PRJ-SUPER-DEFAULTS
    kind: structural
    description: Projection defaults — age 46 → retirement 67, end age 92 (ASIC assumed drawdown period)
    calculator: projection.super
    input: { calculation_date: '2026-10-11', date_of_birth: '1980-06-15', current_balance: 150000, salary: 95000, return_accumulation: 0.061, return_retirement: 0.067 }
    expect: { status: ok, result: { retirement_age: 67, end_age: 92 } }
    source: https://www.legislation.gov.au/F2022L00895/latest/text
    checked: orchestrator
  - id: INS-001
    kind: structural
    description: PV of 50,000 for 10 years with zero growth and discount → 500,000
    calculator: insurance.needs
    input: { calculation_date: '2026-10-11', income_replacement: { annual_amount: 50000, years: 10 }, indexation_rate: 0, discount_rate: 0 }
    expect: { status: ok, result: { income_replacement_pv: '500000.00', shortfall: '500000.00' } }
    source: null
    checked: verification/projection.md (ACCEPT)
  - id: INS-002
    kind: structural
    description: Need 1,000,000 less cover 400,000 and liquid assets 100,000 → 500,000
    calculator: insurance.needs
    input: { calculation_date: '2026-10-11', debts_to_repay: 1000000, discount_rate: 0.05, existing_cover: 400000, liquid_assets: 100000 }
    expect: { status: ok, result: { shortfall: '500000.00' } }
    source: null
    checked: verification/projection.md (ACCEPT)
  - id: INS-004
    kind: structural
    description: Shortfall floored at zero (need 300,000, cover 500,000)
    calculator: insurance.needs
    input: { calculation_date: '2026-10-11', debts_to_repay: 300000, discount_rate: 0.05, existing_cover: 500000 }
    expect: { status: ok, result: { shortfall: '0.00' } }
    source: null
    checked: verification/projection.md (ACCEPT)
  - id: INS-005
    kind: structural
    description: Multiple method 10 × 100,000 = 1,000,000
    calculator: insurance.multiple
    input: { annual_income: 100000, multiple: 10 }
    expect: { status: ok, result: { cover: '1000000.00' } }
    source: null
    checked: verification/projection.md (ACCEPT)
  - id: DEBT-001
    kind: structural
    description: P&I repayment 500,000 at 6% over 30 years monthly → 2,997.75
    calculator: debt.repayment
    input: { principal: 500000, annual_rate: 0.06, term_years: 30, frequency: monthly }
    expect: { status: ok, result: { repayment: '2997.75', number_of_repayments: 360 } }
    source: null
    checked: verification/projection.md (ACCEPT; 2,997.7526)
  - id: DEBT-002
    kind: structural
    description: Offset — 500,000 balance, 50,000 offset, 6% monthly → first month interest 2,250.00
    calculator: debt.offset_schedule
    input: { principal: 500000, annual_rate: 0.06, term_years: 30, frequency: monthly, offset_balance: 50000 }
    expect: { status: ok, result: { first_period_interest: '2250.00', minimum_repayment: '2997.75' } }
    source: null
    checked: verification/projection.md (ACCEPT)
  - id: DEBT-IO
    kind: structural
    description: Interest-only 500,000 at 6% monthly → 2,500.00
    calculator: debt.repayment
    input: { principal: 500000, annual_rate: 0.06, term_years: 5, frequency: monthly, repayment_type: interest_only }
    expect: { status: ok, result: { repayment: '2500.00' } }
    source: null
    checked: orchestrator
  - id: PRJ-RET-AGE-FLOOR
    kind: derived
    description: User retirement age 55 below preservation age 60 → 60 used (2022/603 "assumed retirement age") (audit finding 5)
    calculator: projection.super
    input: { calculation_date: '2026-10-11', date_of_birth: '1980-06-15', current_balance: 150000, return_accumulation: 0.06, return_retirement: 0.06, retirement_age: 55 }
    expect: { status: ok, result: { retirement_age: 60 } }
    source: https://www.legislation.gov.au/F2022L00895/latest/text
    checked: verification/projection.md
  - id: PRJ-AFTER-REPEAL-USER-INPUTS
    kind: derived
    description: Projection dated after 2022/603 repeal runs when deflators, retirement age and end age are all supplied (audit finding 6)
    calculator: projection.super
    input: { calculation_date: '2027-07-01', date_of_birth: '1970-01-01', current_balance: 300000, return_accumulation: 0.06, return_retirement: 0.06, wage_inflation: 0.035, cpi_inflation: 0.025, retirement_age: 67, end_age: 90 }
    expect: { status: ok, result: { retirement_age: 67, end_age: 90 } }
    source: https://www.legislation.gov.au/F2022L00895/latest/text
    checked: orchestrator
  - id: PRJ-AFTER-REPEAL-DEFAULTS-BLOCK
    kind: blocking
    description: Same date relying on ASIC defaults → blocked
    calculator: projection.super
    input: { calculation_date: '2027-07-01', date_of_birth: '1970-01-01', current_balance: 300000, return_accumulation: 0.06, return_retirement: 0.06 }
    expect: { status: blocked, blocked_code: PARAMETER_MISSING }
    source: https://www.legislation.gov.au/F2022L00895/latest/text
    checked: orchestrator
