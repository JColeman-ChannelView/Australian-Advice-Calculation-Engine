    source: https://www.health.gov.au/our-work/residential-aged-care/charging/fees/scenarios2025
    checked: verification/aged_care.md
  - id: AC-GRANDFATHERED-BLOCK
    kind: blocking
    description: Entered before 1 Nov 2025 without opting in → blocked (older arrangements not modelled)
    calculator: aged_care.residential_fees
    input: { fee_date: '2026-04-01', entry_date: '2024-05-01', relationship: single, assessable_income: 40000, assessable_assets: 100000 }
    expect: { status: blocked, blocked_code: OUT_OF_SCOPE }
    source: https://www.health.gov.au/our-work/residential-aged-care/charging/fee-and-accommodation-arrangements
    checked: verification/aged_care.md
  - id: AC-LIFETIME-CAP
    kind: derived
    description: NCCC nil once 1,460 days have been paid
    calculator: aged_care.residential_fees
    input: { fee_date: '2026-04-01', entry_date: '2025-11-01', relationship: single, assessable_income: 52000, assessable_assets: 340000, home_value: 960000, nccc_days_paid: 1460 }
