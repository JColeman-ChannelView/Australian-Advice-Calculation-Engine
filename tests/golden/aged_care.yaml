  - id: AC-SAKURA-FULL
    kind: official
    description: Sakura full assessment — income 52,000, assets 340,000 + home 960,000 capped at 214,884 → income-tested 22.92, asset-tested 98.41, MTA 121.33; RAD 650,000 = DAP 136.23; partial RAD 250,000 → DAP 83.84
    calculator: aged_care.residential_fees
    input:
      fee_date: '2026-04-01'
      entry_date: '2026-03-25'
      relationship: single
      assessable_income: 52000
      assessable_assets: 340000
      home_value: 960000
      room_price: 650000
      lump_sum_paid: 250000
      price_agreed_date: '2026-03-25'
    expect:
      status: ok
      result:
        income_tested_amount: '22.92'
        asset_tested_amount: '98.41'
        means_tested_amount: '121.33'
        basic_daily_fee: '66.80'
        hotelling_contribution: '22.15'
        non_clinical_care_contribution: '26.88'
        accommodation: { room_price_as_dap: '136.23', daily_accommodation_payment: '83.84' }
    source: https://www.health.gov.au/our-work/residential-aged-care/charging/fees/scenarios2025
    checked: verification/aged_care.md (scenario table; MPIR 7.65% for a price agreed in Jan–Mar 2026)
  - id: AC-RAJ-FULL
    kind: official
    description: Raj — income 44,000 (couple), assets 78,000 + home counted at 214,884 → 12.93 + 79.77 = 92.70 (requires rounding down; nearest cent would give 92.71)
    calculator: aged_care.residential_fees
    input: { fee_date: '2026-04-01', entry_date: '2026-03-25', relationship: couple, assessable_income: 44000, assessable_assets: 78000, home_value: 600000 }
    expect: { status: ok, result: { income_tested_amount: '12.93', asset_tested_amount: '79.77', means_tested_amount: '92.70', hotelling_contribution: '20.40', non_clinical_care_contribution: '0.00' } }
    source: https://www.health.gov.au/our-work/residential-aged-care/charging/fees/scenarios2025
    checked: verification/aged_care.md (open item Q12 — rounding inferred)
  - id: AC-JULIE-FULL
    kind: official
    description: Julie — low means; home exempt (protected person); MTA 19.42; DAC = lower of 19.42, 72.30, room DAP 92.22 → 19.42
    calculator: aged_care.residential_fees
    input: { fee_date: '2026-04-01', entry_date: '2026-03-25', relationship: couple, assessable_income: 44000, assessable_assets: 78000, home_value: 600000, home_exempt: true, room_price: 440000, price_agreed_date: '2026-03-25' }
    expect: { status: ok, result: { means_tested_amount: '19.42', accommodation: { low_means: true, daily_accommodation_contribution: '19.42', government_accommodation_supplement: '52.88', room_price_as_dap: '92.22' } } }
    source: https://www.health.gov.au/our-work/residential-aged-care/charging/fees/scenarios2025
    checked: verification/aged_care.md
  - id: AC-JULIE-RAC
    kind: official
    description: Julie with partial RAC $40,000 — equivalent 40,000 × 7.65% / 365 = 8.38/day; reduced DAC 19.42 − 8.38 = 11.04 (audit finding 1)
    calculator: aged_care.residential_fees
    input: { fee_date: '2026-04-01', entry_date: '2026-03-25', relationship: couple, assessable_income: 44000, assessable_assets: 78000, home_value: 600000, home_exempt: true, room_price: 440000, lump_sum_paid: 40000 }
    expect: { status: ok, result: { accommodation: { lump_sum_daily_equivalent: '8.38', daily_accommodation_contribution: '11.04' }, total_daily: '77.84' } }
    source: https://www.health.gov.au/our-work/residential-aged-care/charging/fees/scenarios2025
    checked: verification/aged_care.md (Julie partial RAC; low-means MPIR at entry date)
