    kind: official
    description: HELP 2026-27 — ATO example Christina (repayment income stated as 86,380)
    calculator: tax.help_repayment
    input: { financial_year: '2026-27', repayment_income: 86380 }
    expect: { status: ok, result: { help_repayment: '2527.80' } }
    source: https://www.ato.gov.au/tax-rates-and-codes/study-and-training-support-loans-rates-and-repayment-thresholds
    checked: verification/tax.md (ACCEPT; research note "income inferred" was wrong — income is stated)
